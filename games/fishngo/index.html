<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=portrait" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a2540" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Google Fonts — 게임 실사용 폰트만(배너 디스플레이 + 레이아웃 Gaegu/Poor Story/Noto Sans KR).
         ⚠ 경량화: 나머지 ~17종은 #uieditor 드롭다운 전용 → 프로덕션에서 안 받고 dev 에서만 로드(main.js). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Black+Ops+One&family=Russo+One&family=Gaegu&family=Poor+Story&family=Noto+Sans+KR:wght@400;700&display=block" />
    <title>Fishing Game</title>
    <style>
      /* ─── Jua — UI/본문 폰트 (OFL, 저작권 프리, 셀프호스팅). 한글+라틴. ───
         캔버스 게임이므로 게임 시작 전 main.js 가 document.fonts 로 선로딩.
         한글은 단일 woff2(368KB) → 로드 후 모든 음절 즉시 렌더 (폴백 없음). */
      @font-face {
        font-family: 'Jua';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/jua-latin-400.woff2') format('woff2');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family: 'Jua';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/jua-korean-400.woff2') format('woff2');
        unicode-range: U+1100-11FF,U+3001-3003,U+3008-3011,U+3013-301F,U+302E-3030,U+3037,U+30FB,U+3131-318E,U+3200-321E,U+3260-327F,U+327F-32CF,U+3380-33DD,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF01-FF60,U+FFE0-FFE6;
      }
      :root {
        /* 세이프에어리어 인셋을 커스텀 속성으로 노출 → main.js 가 JS 로 읽어 게임 HUD/탭 배치에 사용.
           (env() 는 getComputedStyle 로 직접 못 읽어 커스텀 속성 경유가 표준 기법) */
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body {
        margin: 0;
        padding: 0;
        /* 레터박스·여백 영역 = 검정(사용자 요청: 청색 대신 검정). 캔버스 빈 영역과 톤 일치. */
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        /* 풀블리드: 캔버스를 화면 끝까지(노치 아래 어두운 띠 제거). 세이프영역은 CSS 패딩 대신
           게임이 HUD/탭에만 적용(window.__safeArea → src/ui/sceneChrome.js anchorPos). */
      }
      #game-container canvas { display: block; }
      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /* 부트 스플래시 — 청색 단색 대신 바다 톤 그라데이션 + 타이틀 + 스피너(즉시 표시, 자산 의존 X).
           LoadingScene(penguin)이 렌더되면 제거되어 청색 갭 없이 자연 전환. */
        background: linear-gradient(180deg, #1a6ea8 0%, #0e4d80 55%, #062a55 100%);
        color: #fff;
        z-index: 10;
      }
      .loading .title {
        font-size: 2.4rem; font-weight: 800; letter-spacing: 1px;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
        animation: loadingPulse 1.4s ease-in-out infinite;
      }
      .loading .spinner {
        width: 44px; height: 44px; border-radius: 50%;
        border: 5px solid rgba(255, 255, 255, 0.25); border-top-color: #ffd34e;
        animation: loadingSpin 0.9s linear infinite;
      }
      @keyframes loadingSpin { to { transform: rotate(360deg); } }
      @keyframes loadingPulse { 0%, 100% { opacity: 0.92; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      /* 가로 모드 안내 (세로 게임이므로 가로에서 회전 권고) */
      .rotate-hint { display: none; }
      @media (orientation: landscape) and (max-width: 1000px) {
        #game-container { display: none; }
        .rotate-hint {
          display: flex;
          position: fixed;
          inset: 0;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 16px;
          background: #0a2540;
          color: #fff;
          font-size: 18px;
          text-align: center;
          padding: 24px;
        }
        .rotate-hint .icon { font-size: 48px; }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="loading"><div class="title">Fish &amp; Go!</div><div class="spinner"></div></div>
    </div>
    <div class="rotate-hint">
      <div class="icon">📱↻</div>
      <div><strong>세로로 돌려주세요</strong></div>
      <div style="font-size: 14px; opacity: 0.7;">이 게임은 세로 모드 전용입니다</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
