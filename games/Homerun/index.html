<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ **비표준 토큰(orientation=portrait)을 넣지 않는다**(2026-08-21 제거). WebKit 뷰포트 파서가
         모르는 키를 만나면 그 뒤 인자 해석이 흔들려 **`viewport-fit=cover` 가 무효화될 수 있다** —
         실측: PWA 에서 창이 430x774(기기 932)로 잡히고 `env(safe-area-inset-*)` 가 전부 0으로
         보고돼, 노치·홈인디케이터 자리가 검게 남았다. 회전 제어는 아래 미디어쿼리로 한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1E88E5" />
    <title>홈런팝</title>
    <!--
      Google AdSense H5 게임 광고 — Ad Placement API 보일러플레이트(2026-09-02, 틱택토와 동일).
      계정(pub-6271220374352684)은 심사 대기 중. 실제로 이 SDK 를 호출하는 건 `adsense` 타겟
      (`npm run dev:adsense`)의 어댑터뿐 — 다른 타겟(web/toss)은 태그만 실리고 안 쓴다.
      ⚠️⚠️ `data-adbreak-test="on"` — 실서비스로 옮기기 전에 반드시 지울 것. Google 자체 테스트
      모드(서버 요청 없이 목업 광고)라, 남아 있으면 승인 후에도 영원히 실광고가 안 뜬다.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" data-ad-client="ca-pub-6271220374352684" data-adbreak-test="on" crossorigin="anonymous"></script>
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      function adBreak(o) { adsbygoogle.push(o); }
      function adConfig(o) { adsbygoogle.push(o); }
    </script>
    <style>
      /* 폰트는 **로컬 자체 호스팅**이다 — src/fonts/fonts.css(scripts/fonts-build.mjs 생성)를
         src/main.ts 가 import 한다. 여기(index.html)에서 @import 하지 않는 이유는 두 가지다:
           · public/ 의 CSS 는 Vite 가 처리하지 않아 빌드에서 해석에 실패한다(실측)
           · TS 에서 import 하면 Vite 가 woff2 URL 을 base 에 맞춰 재작성해 준다
         예전엔 Google Fonts CDN 을 @import 했는데 계속 깨졌다: 에디터가 쓰는 7종 중 4종이 목록에
         없어 34곳 중 20곳이 시스템 폰트로 폴백됐고, 웹뷰에서 CDN 이 늦으면 Phaser 캔버스가 이미
         폴백으로 그린 글자를 되돌리지 못해 "일부 텍스트만 다른 폰트로 굳는" 증상이 남았다. */
      /* 세이프에어리어 인셋(노치·다이나믹 아일랜드·홈바) — JS 는 env() 를 직접 못 읽으므로
         :root 커스텀 프로퍼티로 노출(main.ts 의 readSafeArea() 가 getComputedStyle 로 읽는다).
         풀블리드 캔버스(아래 #game-container 는 상단 패딩 없음)라 헤더/라운드표시 UI 를 PlayScene 이
         이 값만큼 코드로 내려 배치한다(사용자 요청: "홈버튼이 아일랜드 독에 가릴 경우"). */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body {
        margin: 0; padding: 0;
        background: #000;
        color: #FFF6D8;
        font-family: "Baloo 2", "Pretendard Variable", "M PLUS Rounded 1c", system-ui, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh; /* 폴백 — 아래 dvh 미지원 웹뷰용 */
        height: 100dvh;
        touch-action: none; user-select: none;
        -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game-container { background: #000;
        position: fixed; inset: 0;
        /* ⚠️ **크기를 직접 지정하지 않는다**(2026-08-21). `position:fixed; inset:0` 만으로 브라우저가
           실제 표시 영역에 맞춰 준다. dvh 가 실제 보이는 높이와 어긋나면 Phaser 가 부모를 실제보다
           크게 재서 **화면이 아래로 밀리고 하단이 잘린다**(실측: 갤럭시 노트8·플립5). */
        overflow: hidden;
        /* ⚠️ **세이프에어리어 패딩을 주지 않는다**(2026-08-21). 캔버스는 화면 전체를 덮어야 하고
           (배경이 노치 밑까지 깔린다), 인셋 회피는 **게임 좌표에서** 가장자리 UI 를 밀어내는 방식으로
           한다(코어 safeZone.ts). 컨테이너에 패딩을 주면 Phaser 가 부모를 보더박스로 재는 것과
           캔버스가 콘텐츠박스에 놓이는 것이 어긋나 하단에 빈 띠가 생길 수 있다. */
        box-sizing: border-box;
      }
      #game-container canvas { display: block; }
      /* 하단 배너 광고 컨테이너 — 토스 SDK(TossAds.attachBanner)가 이 안에 직접 렌더링한다
         (src/ads.ts 참조). width 는 항상 100%, 광고 콘텐츠 높이는 고정형 권장값 96px.
         ⚠️ 예전엔 bottom: env(safe-area-inset-bottom) 으로 홈바 "위에" 띄웠는데, 그러면 배너 아래
         홈바 높이(아이폰 ~34pt)만큼 검은 띠가 남아 배너가 공중에 뜬 것처럼 보였다(사용자 보고:
         아이폰에서 "배너가 위로 뜨고 ... 하단에 여백"). 바닥까지 내리고 그 인셋을 안쪽 패딩으로
         돌려, 흰 배경은 화면 끝까지 이어지되 광고 콘텐츠(96px)는 홈바에 안 겹치게 한다. */
      #ad-banner-container {
        position: fixed; left: 0; right: 0;
        bottom: 0;
        width: 100%;
        height: calc(96px + env(safe-area-inset-bottom, 0px));
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        background: #ffffff;
        z-index: 20;
      }
      /* 광고 제거(NO ADS) 인앱결제 버튼 — 배너와 겹치지 않게 우측 상단쪽에 배치(사용자 요청:
         "오른쪽으로 옮기고 위치는 상단으로 조금 더 올려주세요" — 왼쪽·60px 여유였던 이전 배치를
         오른쪽·90px 여유로 조정).
         이미지 자체가 버튼(Homerun_UI_13, 302×301 정사각) — 배경 없이 이미지만 표시.
         ⚠️ --no-ads-bottom-clearance 는 PlayScene 하단 UI(시즌패스 바) 실측 높이의 근사치다 —
         이 버튼은 순수 DOM 이라 Phaser 게임좌표를 직접 못 읽어 고정값으로 어림한다. 실기기에서
         아이콘 줄과 안 맞으면 이 값만 조정하면 된다. */
      #no-ads-btn {
        position: fixed;
        right: 10px;
        --no-ads-bottom-clearance: 130px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 96px + var(--no-ads-bottom-clearance));
        width: 64px; height: 64px;
        padding: 0; border: 0; background: transparent;
        z-index: 21;
        -webkit-tap-highlight-color: transparent;
      }
      #no-ads-btn img { width: 100%; height: 100%; display: block; }
      #no-ads-btn[hidden] { display: none; }
      .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.7; }
      .rotate-hint { display: none; }
      /* 회전 안내 — 판단 축은 **가로폭이 아니라 세로높이**다(펌프러시 2026-08-18 수정, 전 게임 이식).
         세로 저작이므로 가로 화면에서는 언제나 **높이가 병목**이다(렌더 폭 = 높이 × 저작비의 역수).
         그래서 "얼마나 높은가" 하나로 놀 수 있는지가 갈린다.

         ⚠️ 구 조건 `max-width: 1000px` 은 **양방향으로 틀렸다**:
           · 폴더블 펼침 가로(837×697)·소형 태블릿 가로(1024×768) → 높이가 넉넉해 게임이 멀쩡히
             그려지는데도 안내가 떴다. 이런 기기는 화면비가 정사각에 가까워 **돌려도 세로가 안 나온다**
             — 안내가 막다른 길이 된다.
           · 21:9 가로(1050×450) → 폭이 1000 을 넘어 안내가 안 떴는데, 실제로는 450px 라 비좁다.
         480px 를 경계로 두면 일반 폰 가로(316~450)는 안내, 폴드·태블릿(697~768)은 게임으로 갈린다.

         ⚠️ `pointer: coarse` 는 **터치 기기 한정** 조건이다. 빼면 데스크톱에서 창을 좁히는
         순간 게임이 사라지고 "세로로 돌려주세요"가 뜬다(스토어 심사 반려 사유). */
      @media (orientation: landscape) and (max-height: 480px) and (pointer: coarse) {
        #game-container { display: none; }
        .rotate-hint {
          display: flex; position: fixed; inset: 0;
          align-items: center; justify-content: center; flex-direction: column; gap: 12px;
          background: #1E88E5; color: #fff; font-size: 18px; text-align: center; padding: 24px;
        }
      }
    </style>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 본문 글꼴(전 게임 공통): 라틴=Baloo 2 · 한글=Pretendard · 일본어=M PLUS Rounded 1c.
         캔버스가 글리프 단위로 폴백하므로 스택 한 줄이면 언어가 알아서 갈린다.
         ⚠️ @import 가 아니라 <link> 로 건다 — @import 는 등록이 늦어 캔버스가 시스템 글꼴로 굳는다. -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=M+PLUS+Rounded+1c:wght@400;700;900&display=block" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  </head>
  <body>
    <div id="game-container"><div class="loading">홈런팝 로딩 중...</div></div>
    <div id="ad-banner-container"></div>
    <button id="no-ads-btn" type="button" hidden aria-label="광고 제거">
      <img src="/ui/uploads/up_Homerun_UI_13.png" alt="" />
    </button>
    <div class="rotate-hint"><div style="font-size:48px">📱↻</div><strong>세로로 돌려주세요</strong></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
