<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#9B5DE5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MATCHSLOT CITY</title>
    <style>
      /* Jua/Do Hyeon — OFL 한글+라틴 둥근 게임체 (P0 CDN, P1 셀프호스팅 전환).
         Do Hyeon 은 코인·베팅 숫자(굵은 카지노 톤)에, Jua 는 일반 라벨에 쓴다.
         Kanit(ital 700/800) — 정보패널 점수 숫자: 굵은 이텔릭 카지노 폰트(라틴 글리프), 한글 라벨은 Do Hyeon 폴백. */
      @import url('https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&family=Kanit:ital,wght@1,700;1,800&display=block');
      /* DSEG7 Classic — 7-세그먼트 LCD 디지털 시계 폰트(보상 게이지 타이머용, 요청). 셀프호스팅(public/fonts) — base './' 라 상대경로. */
      @font-face {
        font-family: 'DSEG7 Classic';
        src: url('fonts/DSEG7Classic-Bold.woff2') format('woff2');
        font-weight: 700; font-style: normal; font-display: block;
      }
      html, body {
        margin: 0; padding: 0;
        background: #000;
        color: #F4ECFF;
        font-family: 'Jua', system-ui, sans-serif;
        overflow: hidden;
        width: 100vw; height: 100dvh;
        touch-action: none; user-select: none;
        -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game-container { background: #000;
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        overflow: hidden;
      }
      #game-container canvas { display: block; }
      .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.7; }
      .rotate-hint { display: none; }
      @media (orientation: landscape) and (max-width: 1000px) {
        #game-container { display: none; }
        .rotate-hint {
          display: flex; position: fixed; inset: 0;
          align-items: center; justify-content: center; flex-direction: column; gap: 12px;
          background: #1A1030; color: #fff; font-size: 18px; text-align: center; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"><div class="loading">MATCHSLOT CITY 로딩 중...</div></div>
    <div class="rotate-hint"><div style="font-size:48px">📱↻</div><strong>세로로 돌려주세요</strong></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
