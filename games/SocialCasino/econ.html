<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATCHSLOT CITY · 경제 콘솔</title>
    <style>
      :root {
        --bg: #0e1320; --bg2: #141b2d; --card: #1a2336; --card2: #202b42;
        --line: #2a3550; --txt: #e7ecf7; --txt2: #9fb0d0; --txt3: #6b7a9c;
        --accent: #5b8cff; --accent2: #38d39f; --gold: #ffce5c;
        --good: #2ecc8f; --bad: #ff5d6c; --warn: #ffb454;
        --shadow: 0 6px 22px rgba(0,0,0,.35);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--txt);
        font-family: "Inter", "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 14px; }
      a { color: var(--accent); }
      .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 22px 64px; }

      /* Top bar */
      .topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, var(--bg) 70%, transparent);
        padding: 8px 0 14px; }
      .brand h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
      .brand p { margin: 2px 0 0; color: var(--txt2); font-size: 12px; }
      .spacer { flex: 1; }
      .btn { background: var(--card2); color: var(--txt); border: 1px solid var(--line); border-radius: 10px;
        padding: 9px 14px; font-size: 13px; cursor: pointer; transition: .15s; white-space: nowrap; }
      .btn:hover { border-color: var(--accent); color: #fff; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .btn.ghost { background: transparent; }
      .btn.danger:hover { border-color: var(--bad); color: var(--bad); }

      /* KPI row */
      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 6px 0 18px; }
      .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
      .kpi .k-label { color: var(--txt2); font-size: 12px; margin-bottom: 6px; }
      .kpi .k-val { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
      .kpi .k-sub { color: var(--txt3); font-size: 11px; margin-top: 4px; }
      .kpi.good { border-left: 3px solid var(--good); }
      .kpi.bad { border-left: 3px solid var(--bad); }
      .kpi.warn { border-left: 3px solid var(--warn); }

      /* Section + cards */
      .section { margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
      .section h2 { font-size: 15px; margin: 0; color: #fff; }
      .section .hint { color: var(--txt3); font-size: 12px; }
      .grid { display: grid; gap: 14px; }
      .grid.cols2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
      .grid.cols3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
      .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--txt); font-weight: 600; }
      .card .cap { color: var(--txt3); font-size: 11px; margin-top: 8px; line-height: 1.5; }
      canvas { width: 100%; height: 190px; display: block; }

      /* Health pills */
      .pills { display: flex; flex-wrap: wrap; gap: 10px; }
      .pill { display: flex; align-items: center; gap: 9px; background: var(--card); border: 1px solid var(--line);
        border-radius: 11px; padding: 10px 13px; min-width: 250px; flex: 1 1 280px; }
      .pill .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; margin-top: 3px; }
      .pill.ok .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
      .pill.fail .dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
      .pill .p-body { flex: 1; }
      .pill .p-label { font-size: 12.5px; font-weight: 600; }
      .pill .p-val { color: var(--txt2); font-size: 11.5px; margin-top: 2px; }
      .pill .p-why { color: var(--txt3); font-size: 11px; margin-top: 4px; line-height: 1.45; }
      .pill .p-crit { color: var(--bad); font-size: 10px; font-weight: 700; letter-spacing: .4px; }

      /* Lever rows */
      .lever { padding: 11px 0; border-bottom: 1px solid var(--line); }
      .lever:last-child { border-bottom: none; }
      .lever .l-top { display: flex; align-items: baseline; gap: 8px; }
      .lever .l-name { font-size: 13px; font-weight: 600; }
      .lever .l-ssot { color: var(--txt3); font-size: 11px; }
      .lever .l-changed { color: var(--gold); font-size: 11px; font-weight: 700; }
      .lever .l-ctrl { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
      .lever input[type=range] { flex: 1; accent-color: var(--accent); }
      .lever input[type=number] { width: 96px; background: var(--bg2); border: 1px solid var(--line); color: var(--txt);
        border-radius: 8px; padding: 6px 8px; font-size: 13px; }
      .lever .l-drives { color: var(--txt3); font-size: 11px; margin-top: 5px; line-height: 1.45; }

      /* Tables */
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
      th { color: var(--txt2); font-weight: 600; }
      td input { width: 100%; background: var(--bg2); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 5px 7px; }

      .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
      .toggle input { width: 18px; height: 18px; accent-color: var(--accent2); }

      textarea { width: 100%; min-height: 60px; background: var(--bg2); border: 1px solid var(--line); color: var(--txt);
        border-radius: 10px; padding: 9px 11px; font-size: 13px; resize: vertical; font-family: inherit; }
      pre { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto;
        font-size: 12px; color: var(--txt2); max-height: 260px; }
      .log-item { border-bottom: 1px solid var(--line); padding: 9px 0; }
      .log-item .l-ts { color: var(--txt3); font-size: 11px; }
      .log-item .l-note { margin: 3px 0; }
      .log-item .l-diff { color: var(--txt2); font-size: 11.5px; }
      .busy { position: fixed; top: 14px; right: 18px; background: var(--accent); color: #fff; padding: 7px 13px;
        border-radius: 20px; font-size: 12px; z-index: 50; box-shadow: var(--shadow); display: none; }
      .busy.on { display: block; }
      .muted { color: var(--txt3); }

      /* 쉬운 설명 — 인트로 / 용어사전 / 쉬운말 */
      .intro { background: linear-gradient(135deg, #1b2742, #1a2336); border: 1px solid var(--accent);
        border-radius: 14px; padding: 16px 18px; margin: 6px 0 16px; box-shadow: var(--shadow); }
      .intro h3 { margin: 0 0 8px; font-size: 14px; color: #cfe0ff; }
      .intro p { margin: 6px 0; color: var(--txt2); font-size: 13px; line-height: 1.6; }
      .intro b { color: var(--gold); }
      .intro .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--txt2); }
      .intro .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .intro .sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
      .pill .p-plain { color: #bfe3d2; font-size: 11.5px; margin-top: 5px; line-height: 1.5;
        border-top: 1px dashed var(--line); padding-top: 5px; }
      .help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 22px; }
      .term { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .term .t-name { font-weight: 700; color: #fff; font-size: 13px; }
      .term .t-name span { color: var(--txt3); font-weight: 400; font-size: 11px; }
      .term .t-def { color: var(--txt2); font-size: 12px; margin-top: 3px; line-height: 1.55; }
      details.help > summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; user-select: none; }
      details.help[open] > summary { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="busy" id="busy">계산 중…</div>
    <div class="wrap" id="app"></div>
    <script type="module" src="/src/econ/main.ts"></script>
  </body>
</html>
