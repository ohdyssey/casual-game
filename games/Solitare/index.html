<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#E86FA6" />
    <title>솔리테어 하이츠</title>
    <style>
      /* Jua/Do Hyeon — OFL 한글+라틴 둥근 게임체 (P0 CDN, P1 셀프호스팅 전환). */
      @import url('https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=block');
      html, body {
        margin: 0; padding: 0;
        background: #000;
        color: #FFF6F0;
        font-family: 'Jua', system-ui, sans-serif;
        overflow: hidden;
        width: 100vw; height: 100dvh;
        touch-action: none; user-select: none;
        -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game-container { background: #000;
        position: fixed; inset: 0;
        width: 100vw; height: 100dvh;
        overflow: hidden;
        /* ⚠️ top 은 반드시 0 (형제 게임 전부 동일). Phaser ScaleManager 는 부모 크기를
           getBoundingClientRect() = **padding 포함 보더박스**로 재므로, padding-top 을 주면
           캔버스는 100dvh 높이 그대로 만들어지면서 그만큼 아래로 밀려 하단이 overflow:hidden 에
           잘린다(아이폰에서 뽑기더미/되돌리기/WILD 버튼 잘림). 노치 회피는 코드 배치로 해결할 것. */
        padding: 0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
        box-sizing: border-box;
      }
      #game-container canvas { display: block; }
      .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.7; }
      .rotate-hint { display: none; }
      @media (orientation: landscape) and (max-width: 1000px) {
        #game-container { display: none; }
        .rotate-hint {
          display: flex; position: fixed; inset: 0;
          align-items: center; justify-content: center; flex-direction: column; gap: 12px;
          background: #2a1830; color: #fff; font-size: 18px; text-align: center; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"><div class="loading">솔리테어 로딩 중...</div></div>
    <div class="rotate-hint"><div style="font-size:48px">📱↻</div><strong>세로로 돌려주세요</strong></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
