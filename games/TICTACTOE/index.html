<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ **비표준 토큰(orientation=portrait)을 넣지 않는다**(2026-08-21 제거). WebKit 뷰포트 파서가
         모르는 키를 만나면 그 뒤 인자 해석이 흔들려 **`viewport-fit=cover` 가 무효화될 수 있다** —
         실측: PWA 에서 창이 430x774(기기 932)로 잡히고 `env(safe-area-inset-*)` 가 전부 0으로
         보고돼, 노치·홈인디케이터 자리가 검게 남았다. 회전 제어는 아래 미디어쿼리로 한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0714" />
    <!-- 상대경로다(base 가 './'(허브 하위)와 '/'(설치형 PWA)로 갈리므로 절대경로를 쓰면 한쪽이 깨진다) -->
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>틱택토 네온</title>
    <!--
      Google AdSense H5 게임 광고 — Ad Placement API 보일러플레이트(2026-09-02).
      계정(pub-6271220374352684)은 신청 후 심사 대기 중 — 승인 전에도 태그는 붙여 둬야
      심사가 코드를 확인할 수 있다. 승인 전엔 광고가 안 채워질 수 있고, 그 경우 게임 쪽
      어댑터(src/store/adsense.ts)가 'unavailable' 로 받아 기존 TEST AD 목업으로 대체한다.
      ⚠️ 이 태그는 index.html 에 고정돼 있어 빌드 타겟(web/adsense/...)과 무관하게 항상 실린다 —
      실제로 이 SDK 를 호출하는 건 `adsense` 타겟(`npm run dev:adsense`)의 어댑터뿐이다.

      ⚠️⚠️ **`data-adbreak-test="on"` — 실서비스로 옮기기 전에 반드시 지울 것.**
      Google 자체 테스트 모드(공식 문서: developers.google.com/ad-placement/docs/test) — 서버에
      실제 광고 요청을 안 보내고 Google 자체 목업 광고를 대신 보여준다(계정 승인과 무관하게 지금
      바로 UI·콜백 흐름 검증 가능). 이 속성이 남아 있으면 **승인 후에도 영원히 실광고가 안 뜨고
      진짜 수익도 안 난다** — `adsense` 타겟을 `web.ts` 로 승격할 때(또는 실서비스에 이 index.html
      을 그대로 쓰게 될 때) 이 속성부터 지워야 한다.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" data-ad-client="ca-pub-6271220374352684" data-adbreak-test="on" crossorigin="anonymous"></script>
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      function adBreak(o) { adsbygoogle.push(o); }
      function adConfig(o) { adsbygoogle.push(o); }
    </script>
    <style>
      /* 폰트는 **로컬 자체 호스팅**이다 — src/fonts/fonts.css 를 src/main.ts 가 import 한다.
         (여기서 CDN 을 @import 하면 웹뷰에서 늦게 도착해 캔버스가 폴백 폰트로 굳는다) */
      html, body {
        margin: 0; padding: 0;
        background: #0A0714;
        color: #E8E6FF;
        font-family: "Baloo 2", "Pretendard Variable", "M PLUS Rounded 1c", system-ui, sans-serif;
        overflow: hidden;
        width: 100vw; height: 100dvh;
        touch-action: none; user-select: none;
        -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game-container { background: #0A0714;
        position: fixed; inset: 0;
      /* ⚠️ **크기를 직접 지정하지 않는다**(2026-08-21). `position:fixed; inset:0` 만으로 브라우저가
         실제 표시 영역에 맞춰 준다. 예전엔 `width:100vw; height:100dvh` 를 함께 줬는데, 안드로이드
         주소창·시스템바 때문에 dvh 가 실제 보이는 높이와 어긋나면 Phaser 가 부모를 실제보다 크게
         재서 **화면이 아래로 밀리고 하단이 잘렸다**(실측: 갤럭시 노트8·플립5). */
        overflow: hidden;
        /* ⚠️ **세이프에어리어 패딩을 주지 않는다**(2026-08-21). 캔버스는 화면 전체를 덮어야 하고
           (배경이 노치 밑까지 깔린다), 인셋 회피는 **게임 좌표에서** 가장자리 UI 를 밀어내는 방식으로
           한다(코어 safeZone.ts). 컨테이너에 패딩을 주면 Phaser 가 부모를 보더박스로 재는 것과
           캔버스가 콘텐츠박스에 놓이는 것이 어긋나 하단에 빈 띠가 생길 수 있다. */
        box-sizing: border-box;
      }
      #game-container canvas { display: block; }
      /* 하단 배너 광고 컨테이너 — 토스 SDK(TossAds.attachBanner)가 이 안에 직접 렌더링한다
         (src/ads.ts 참조). 광고 콘텐츠 높이는 고정형 권장값 96px.
         ⚠️ 바닥(bottom:0)까지 내리고 세이프에어리어는 안쪽 패딩으로 돌린다 — 홈바 "위에" 띄우면
         배너 아래에 검은 띠가 남아 공중에 뜬 것처럼 보인다(홈런팝에서 확인된 문제). */
      /* ⚠️ 기본은 숨김이다. 광고가 실제로 붙는 타겟에서만 src/ads.ts 가 켠다.
         (기본을 보이게 두면 광고 없는 빌드에서 하단에 흰 띠가 한 프레임 번쩍인다) */
      #ad-banner-container {
        display: none;
        position: fixed; left: 0; right: 0;
        bottom: 0;
        width: 100%;
        height: calc(96px + env(safe-area-inset-bottom, 0px));
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        background: #ffffff;
        z-index: 20;
      }
      /* 광고 제거(NO ADS) 인앱결제 버튼 — 이미지 자체가 버튼(배경 없음).
         배너 바로 위, 하단 HUD(전적·규칙 줄은 가운데 정렬)와 겹치지 않는 오른쪽 여백에 둔다. */
      #no-ads-btn {
        position: fixed;
        right: 10px;
        --no-ads-bottom-clearance: 110px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 96px + var(--no-ads-bottom-clearance));
        width: 64px; height: 64px;
        padding: 0; border: 0; background: transparent;
        z-index: 21;
        -webkit-tap-highlight-color: transparent;
      }
      #no-ads-btn img { width: 100%; height: 100%; display: block; }
      #no-ads-btn[hidden] { display: none; }
      .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.7; }
      .rotate-hint { display: none; }
      /* 회전 안내는 **터치 기기에만**. `pointer: coarse` 가 없으면 데스크톱(MS Store 등)에서
         창을 좁히는 순간 게임이 사라지고 "세로로 돌려주세요"가 뜬다 — 심사 반려 사유. */
      /* 회전 안내 — 판단 축은 **가로폭이 아니라 세로높이**다(펌프러시 2026-08-18 수정, 전 게임 이식).
         세로 저작이므로 가로 화면에서는 언제나 **높이가 병목**이다(렌더 폭 = 높이 × 저작비의 역수).
         그래서 "얼마나 높은가" 하나로 놀 수 있는지가 갈린다.

         ⚠️ 구 조건 `max-width: 1000px` 은 **양방향으로 틀렸다**:
           · 폴더블 펼침 가로(837×697)·소형 태블릿 가로(1024×768) → 높이가 넉넉해 게임이 멀쩡히
             그려지는데도 안내가 떴다. 이런 기기는 화면비가 정사각에 가까워 **돌려도 세로가 안 나온다**
             — 안내가 막다른 길이 된다.
           · 21:9 가로(1050×450) → 폭이 1000 을 넘어 안내가 안 떴는데, 실제로는 450px 라 비좁다.
         480px 를 경계로 두면 일반 폰 가로(316~450)는 안내, 폴드·태블릿(697~768)은 게임으로 갈린다.

         ⚠️ `pointer: coarse` 는 **터치 기기 한정** 조건이다. 빼면 데스크톱에서 창을 좁히는
         순간 게임이 사라지고 "세로로 돌려주세요"가 뜬다(스토어 심사 반려 사유). */
      @media (orientation: landscape) and (max-height: 480px) and (pointer: coarse) {
        #game-container { display: none; }
        .rotate-hint {
          display: flex; position: fixed; inset: 0;
          align-items: center; justify-content: center; flex-direction: column; gap: 12px;
          background: #1A1030; color: #fff; font-size: 18px; text-align: center; padding: 24px;
        }
      }
    </style>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 본문 글꼴(전 게임 공통): 라틴=Baloo 2 · 한글=Pretendard · 일본어=M PLUS Rounded 1c.
         캔버스가 글리프 단위로 폴백하므로 스택 한 줄이면 언어가 알아서 갈린다.
         ⚠️ @import 가 아니라 <link> 로 건다 — @import 는 등록이 늦어 캔버스가 시스템 글꼴로 굳는다. -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=M+PLUS+Rounded+1c:wght@400;700;900&display=block" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  </head>
  <body>
    <div id="game-container"><div class="loading">틱택토 네온 로딩 중...</div></div>
    <div id="ad-banner-container"></div>
    <button id="no-ads-btn" type="button" hidden aria-label="광고 제거">
      <img src="img/no-ads.png" alt="" />
    </button>
    <div class="rotate-hint"><div style="font-size:48px">📱↻</div><strong>세로로 돌려주세요</strong></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
